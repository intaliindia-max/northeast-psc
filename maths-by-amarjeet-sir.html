<style>

p{margin:0;color:var(--muted)}
a.btn{justify-self:center;display:inline-block;margin-top:6px;padding:.75em 1.3em;border-radius:8px;background:#0b2d6b;color:#fff;font-weight:700;text-decoration:none}
